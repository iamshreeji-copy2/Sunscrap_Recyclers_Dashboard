<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="satsSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="satsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  <!-- Solar Icon / Energy Emblem -->
  <g transform="translate(10, 5)">
    <circle cx="30" cy="30" r="17" fill="url(#satsSun)" />
    <!-- Radiating Ray petals -->
    <path d="M 30 5 L 34 11 L 26 11 Z" fill="#FBBF24" />
    <path d="M 30 55 L 34 49 L 26 49 Z" fill="#FBBF24" />
    <path d="M 5 30 L 11 34 L 11 26 Z" fill="#FBBF24" />
    <path d="M 55 30 L 49 34 L 49 26 Z" fill="#FBBF24" />
    <path d="M 12 12 L 18 15 L 15 19 Z" fill="#FBBF24" />
    <path d="M 48 48 L 42 45 L 45 41 Z" fill="#FBBF24" />
    <path d="M 12 48 L 18 45 L 15 41 Z" fill="#FBBF24" />
    <path d="M 48 12 L 42 15 L 45 19 Z" fill="#FBBF24" />
    <!-- PV Grid Cells Inside Sun -->
    <rect x="22" y="22" width="7" height="7" rx="1.5" fill="#0A1128" opacity="0.9"/>
    <rect x="31" y="22" width="7" height="7" rx="1.5" fill="#0A1128" opacity="0.9"/>
    <rect x="22" y="31" width="7" height="7" rx="1.5" fill="#0A1128" opacity="0.9"/>
    <rect x="31" y="31" width="7" height="7" rx="1.5" fill="#0A1128" opacity="0.9"/>
  </g>
  <!-- Brand Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="75" y="28" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">SATs</text>
    <text x="135" y="28" font-size="12" font-weight="800" fill="#F59E0B" letter-spacing="1">SOLUTIONS</text>
    <text x="75" y="45" font-size="11" font-weight="700" fill="url(#satsAccent)" letter-spacing="2">SOLAR SCADA DASHBOARD</text>
    <text x="75" y="59" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="0.8">satsolutions.in • 4,640 kWp</text>
  </g>
</svg>
