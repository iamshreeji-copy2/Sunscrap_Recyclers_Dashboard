version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sunscrap_postgres
    restart: always
    environment:
      POSTGRES_DB: sunscrap_scada
      POSTGRES_USER: sunscrap_user
      POSTGRES_PASSWORD: sunscrap_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: sunscrap_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sunscrap_web
    restart: always
    environment:
      DEBUG: "False"
      POSTGRES_DB: sunscrap_scada
      POSTGRES_USER: sunscrap_user
      POSTGRES_PASSWORD: sunscrap_secure_pass_2026
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DATA_SOURCE: demo
      PLANT_ORGANIZATION: "Sunscrap Recyclers PVT LTD"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    container_name: sunscrap_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
