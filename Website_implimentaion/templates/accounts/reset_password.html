{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — SATs Solar SCADA</title>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <style>
        body {
            background-color: var(--nav-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card-box {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.92rem;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="card-box">
    <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Set New Password</h2>
    <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 20px;">Please choose a strong password with at least 8 characters.</p>

    {% if messages %}
        <div style="margin-bottom: 16px;">
            {% for msg in messages %}
                <div style="padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 500;
                    {% if msg.tags == 'error' %}background: var(--error-bg); color: var(--error);
                    {% else %}background: var(--success-bg); color: var(--success);{% endif %}">
                    {{ msg }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 14px;">
            <label style="display:block; font-size:0.82rem; font-weight:600; color:var(--text-main); margin-bottom:6px;">New Password</label>
            <input type="password" name="new_password" required minlength="8" placeholder="••••••••" class="form-input">
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display:block; font-size:0.82rem; font-weight:600; color:var(--text-main); margin-bottom:6px;">Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="8" placeholder="••••••••" class="form-input">
        </div>
        <button type="submit" class="btn-submit">Save Password & Proceed</button>
    </form>
</div>

</body>
</html>
