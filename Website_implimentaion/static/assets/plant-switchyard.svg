<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky_sub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky_sub)"/>
  <!-- Gravel Ground -->
  <rect y="320" width="800" height="130" fill="#64748B"/>
  <!-- Step-Up Transformer 11kV/66kV -->
  <rect x="280" y="170" width="240" height="150" fill="#334155" stroke="#1E293B" stroke-width="3"/>
  <rect x="310" y="140" width="180" height="30" fill="#475569"/>
  <!-- Bushings -->
  <rect x="330" y="100" width="14" height="40" fill="#94A3B8" stroke="#0F172A"/>
  <rect x="395" y="90" width="14" height="50" fill="#94A3B8" stroke="#0F172A"/>
  <rect x="460" y="100" width="14" height="40" fill="#94A3B8" stroke="#0F172A"/>
  <!-- Radiator Fins -->
  <line x1="290" y1="190" x2="290" y2="300" stroke="#1E293B" stroke-width="4"/>
  <line x1="300" y1="190" x2="300" y2="300" stroke="#1E293B" stroke-width="4"/>
  <line x1="500" y1="190" x2="500" y2="300" stroke="#1E293B" stroke-width="4"/>
  <line x1="510" y1="190" x2="510" y2="300" stroke="#1E293B" stroke-width="4"/>
  <!-- Transmission Tower Gantry in Background -->
  <polygon points="120,40 130,40 150,320 100,320" fill="none" stroke="#1E293B" stroke-width="3"/>
  <polygon points="670,40 680,40 700,320 650,320" fill="none" stroke="#1E293B" stroke-width="3"/>
  <line x1="120" y1="80" x2="680" y2="80" stroke="#0F172A" stroke-width="2"/>
  <line x1="120" y1="100" x2="680" y2="100" stroke="#0F172A" stroke-width="2"/>
  <!-- Title Badge -->
  <rect x="20" y="20" width="380" height="45" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.2)"/>
  <text x="35" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">11 kV / 66 kV Interconnection Substation (GETCO Grid)</text>
</svg>