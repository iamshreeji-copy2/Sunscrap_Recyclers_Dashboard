<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716C"/>
      <stop offset="100%" stop-color="#44403C"/>
    </linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect width="800" height="200" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="700" cy="60" r="40" fill="url(#sun)" opacity="0.9"/>
  <!-- Ground -->
  <rect y="200" width="800" height="250" fill="url(#ground)"/>
  <!-- Solar Array Rows in Perspective -->
  <g id="solar-rows">
    <!-- Row 1 (Distant) -->
    <polygon points="50,210 750,210 770,230 30,230" fill="url(#panel)" stroke="#93C5FD" stroke-width="1" opacity="0.7"/>
    <!-- Row 2 -->
    <polygon points="40,240 760,240 780,265 20,265" fill="url(#panel)" stroke="#93C5FD" stroke-width="1" opacity="0.8"/>
    <!-- Row 3 -->
    <polygon points="30,280 770,280 790,315 10,315" fill="url(#panel)" stroke="#60A5FA" stroke-width="1.5" opacity="0.9"/>
    <!-- Row 4 (Foreground) -->
    <polygon points="20,335 780,335 800,385 0,385" fill="url(#panel)" stroke="#38BDF8" stroke-width="2"/>
  </g>
  <!-- Grid Lines on Foreground Array -->
  <line x1="160" y1="335" x2="150" y2="385" stroke="#93C5FD" stroke-width="1"/>
  <line x1="320" y1="335" x2="310" y2="385" stroke="#93C5FD" stroke-width="1"/>
  <line x1="480" y1="335" x2="480" y2="385" stroke="#93C5FD" stroke-width="1"/>
  <line x1="640" y1="335" x2="650" y2="385" stroke="#93C5FD" stroke-width="1"/>
  <!-- Inverter Stations -->
  <rect x="80" y="300" width="24" height="16" fill="#E2E8F0" stroke="#334155"/>
  <rect x="380" y="300" width="24" height="16" fill="#E2E8F0" stroke="#334155"/>
  <rect x="680" y="300" width="24" height="16" fill="#E2E8F0" stroke="#334155"/>
  <!-- Plant Metadata Overlay Tag -->
  <rect x="20" y="20" width="380" height="55" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)"/>
  <text x="35" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Sunscrap Recyclers PVT LTD — 4.64 MWp</text>
  <text x="35" y="62" fill="#93C5FD" font-family="sans-serif" font-size="11">Sanand GIDC Phase II, Gujarat • GPS: 22.9868° N, 72.3787° E</text>
</svg>