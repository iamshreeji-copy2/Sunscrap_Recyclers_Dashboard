    <rect x="22" y="22" width="7" height="7" rx="1" fill="#0D1A36" opacity="0.85"/>
    <rect x="31" y="22" width="7" height="7" rx="1" fill="#0D1A36" opacity="0.85"/>
    <rect x="22" y="31" width="7" height="7" rx="1" fill="#0D1A36" opacity="0.85"/>
