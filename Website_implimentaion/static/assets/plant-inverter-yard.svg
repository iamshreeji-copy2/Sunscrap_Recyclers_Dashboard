<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="inverter_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="enclosure" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#inverter_bg)"/>
  <!-- Floor Grid -->
  <polygon points="0,360 800,360 800,450 0,450" fill="#334155"/>
  <!-- Inverter Enclosure Cabinets (Sungrow SG300HX line) -->
  <g id="cabinets">
    <!-- Inv 01 -->
    <rect x="50" y="120" width="130" height="240" rx="6" fill="url(#enclosure)" stroke="#64748B" stroke-width="2"/>
    <rect x="65" y="140" width="100" height="45" rx="3" fill="#0F172A"/>
    <text x="80" y="168" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">301.2 kW</text>
    <circle cx="150" cy="150" r="4" fill="#10B981"/>
    <text x="75" y="220" fill="#1E293B" font-family="sans-serif" font-size="11" font-weight="bold">INV-01 (SG300HX)</text>
    <!-- Inv 02 -->
    <rect x="230" y="120" width="130" height="240" rx="6" fill="url(#enclosure)" stroke="#64748B" stroke-width="2"/>
    <rect x="245" y="140" width="100" height="45" rx="3" fill="#0F172A"/>
    <text x="260" y="168" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">299.8 kW</text>
    <circle cx="330" cy="150" r="4" fill="#10B981"/>
    <text x="255" y="220" fill="#1E293B" font-family="sans-serif" font-size="11" font-weight="bold">INV-02 (SG300HX)</text>
    <!-- Inv 08 (Alarm Active Highlight) -->
    <rect x="410" y="120" width="130" height="240" rx="6" fill="url(#enclosure)" stroke="#DC2626" stroke-width="3"/>
    <rect x="425" y="140" width="100" height="45" rx="3" fill="#0F172A"/>
    <text x="445" y="168" fill="#DC2626" font-family="monospace" font-size="14" font-weight="bold">0.00 kW</text>
    <circle cx="510" cy="150" r="4" fill="#DC2626"/>
    <text x="435" y="220" fill="#DC2626" font-family="sans-serif" font-size="11" font-weight="bold">INV-08 (TRIP)</text>
    <!-- Inv 09 -->
    <rect x="590" y="120" width="130" height="240" rx="6" fill="url(#enclosure)" stroke="#64748B" stroke-width="2"/>
    <rect x="605" y="140" width="100" height="45" rx="3" fill="#0F172A"/>
    <text x="620" y="168" fill="#10B981" font-family="monospace" font-size="14" font-weight="bold">304.5 kW</text>
    <circle cx="690" cy="150" r="4" fill="#10B981"/>
    <text x="615" y="220" fill="#1E293B" font-family="sans-serif" font-size="11" font-weight="bold">INV-09 (SG300HX)</text>
  </g>
  <!-- Overhead Cable Trays -->
  <rect x="30" y="80" width="740" height="14" fill="#64748B"/>
  <!-- Title Badge -->
  <rect x="20" y="20" width="390" height="45" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.2)"/>
  <text x="35" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Inverter Room & Control Yard (13x Sungrow SG300HX)</text>
</svg>