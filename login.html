<script>
// Known seeded credential dictionary for static fallback
const AUTH_DICTIONARY = {
    'developer': { pwd: 'Dev@2026', role: 'developer', name: 'Lead Developer' },
    'dev_admin': { pwd: 'Dev@2026', role: 'developer', name: 'Lead Developer' },
    'admin': { pwd: 'SATs@2026', alt_pwd: 'Sunscrap@2026', role: 'administrator', name: 'System Administrator' },
    'darshan_owner': { pwd: 'Owner@2026', role: 'plant_owner', name: 'Darshan Patel' },
    'owner': { pwd: 'Owner@2026', role: 'plant_owner', name: 'Darshan Patel' },
    'viewer': { pwd: 'Viewer@2026', role: 'third_party', name: 'Third Party Auditor' },
    'third_party': { pwd: 'Viewer@2026', role: 'third_party', name: 'Third Party Auditor' }
};

document.addEventListener('DOMContentLoaded', () => {
    // Populate client telemetry
    const devInput = document.getElementById('login-device-name');
    if (devInput) {
        devInput.value = navigator.platform + ' (' + (navigator.userAgentData ? navigator.userAgentData.platform : 'SCADA Workstation') + ')';
    }

    // Toggle password
    const toggleBtn = document.getElementById('btn-show-hide-pwd');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.innerText = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.innerText = 'Show';
            }
        });
    }

    // Check if session already exists
    const existing = localStorage.getItem('scada_session_user');
    if (existing) {
        const banner = document.getElementById('active-session-banner');
        const userEl = document.getElementById('active-session-username');
        const roleEl = document.getElementById('active-session-role');
        if (banner) banner.style.display = 'block';
        if (userEl) userEl.innerText = existing;
        if (roleEl) roleEl.innerText = localStorage.getItem('scada_session_role') || 'Authorized';
    }
});

function selectRolePreset(username, password, role) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
    showError(null);
}

function showError(msg) {
    const errBox = document.getElementById('static-login-error');
    if (!errBox) return;
    if (msg) {
        errBox.innerText = msg;
        errBox.style.display = 'block';
    } else {
        errBox.style.display = 'none';
    }
}

function handleWorkstationLogin(event) {
    const isStatic = window.location.protocol === 'file:' || 
                     window.location.hostname.includes('github.io') || 
                     window.location.pathname.endsWith('.html');

    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;

    // Check against seeded dict or dynamically created users in localStorage
    let userRecord = AUTH_DICTIONARY[u.toLowerCase()];
    if (!userRecord) {
        try {
            const dynamicUsers = JSON.parse(localStorage.getItem('scada_users_list') || '[]');
            const found = dynamicUsers.find(item => item.username.toLowerCase() === u.toLowerCase());
            if (found) {
                userRecord = { pwd: found.password || 'Operator@2026', role: found.role, name: found.name };
            }
        } catch(e) {}
    }

    if (isStatic) {
        event.preventDefault();

        const pwdMatch = userRecord && (userRecord.pwd === p || userRecord.alt_pwd === p);
        if (!userRecord || !pwdMatch) {
            showError("Authentication failed: Invalid operator username or password. Please verify credentials.");
            return;
        }

        // Establish session in browser
        localStorage.setItem('scada_session_user', u);
        localStorage.setItem('scada_session_role', userRecord.role);
        localStorage.setItem('scada_session_name', userRecord.name || u);

        // Record developer audit log with telemetry
        try {
            const auditLog = {
                action: 'USER_LOGIN_SUCCESS',
                user: u,
                role: userRecord.role,
                details: `Successful operator authentication (${userRecord.role})`,
                timestamp: new Date().toLocaleDateString('en-GB') + ' ' + new Date().toLocaleTimeString('en-GB') + ' IST',
                device: navigator.platform + ' Terminal',
                browser: navigator.userAgent.split(' ')[0],
                approx_location: 'Ahmedabad, Gujarat, India (22.9868° N, 72.3787° E)',
                network_provider: 'Jio Fiber High-Speed Gateway'
            };
            let logs = JSON.parse(localStorage.getItem('scada_developer_audit_logs') || '[]');
            logs.unshift(auditLog);
            localStorage.setItem('scada_developer_audit_logs', JSON.stringify(logs.slice(0, 100)));
        } catch(e) {}

        // Navigate to dashboard
        const currentPath = window.location.pathname;
        const target = currentPath.includes('Sunscrap_Recyclers_Dashboard') ? 
                       '/Sunscrap_Recyclers_Dashboard/index.html' : './index.html';
        window.location.replace(target);
    } else {
        // Django backend form submit: also update localStorage session
        if (userRecord) {
            localStorage.setItem('scada_session_user', u);
            localStorage.setItem('scada_session_role', userRecord.role);
        }
    }
}

// =========================================================================
// Fullscreen Background Carousel with Vertical White Line Wipe (Every 3s)
// =========================================================================
(function initLoginBackgroundCarousel() {
    const baseSlide = document.getElementById('slide-base');
    const incomingSlide = document.getElementById('slide-incoming');
    const wipeLine = document.getElementById('wipe-line');
    const sources = Array.from(document.querySelectorAll('#carousel-sources span'))
                         .map(s => s.getAttribute('data-src'))
                         .filter(Boolean);

    if (!baseSlide || !incomingSlide || !wipeLine || !sources.length) return;

    // Helper to resolve relative path if static GitHub Pages
    const isStatic = window.location.protocol === 'file:' || 
                     window.location.hostname.includes('github.io') || 
                     window.location.pathname.endsWith('.html');

    const cleanSlides = sources.map(src => {
        if (isStatic && src.startsWith('/static/')) return '.' + src;
        return src;
    });

    // Preload all 8 slides in memory
    cleanSlides.forEach(src => {
        const img = new Image();
        img.src = src;
    });

    let currentIndex = 0;
    baseSlide.style.backgroundImage = `url('${cleanSlides[0]}')`;

    const WIPE_DURATION = 1050; // 1.05s smooth aesthetic wipe
    const INTERVAL = 3000;       // 3.0s total cycle

    setInterval(() => {
        const nextIndex = (currentIndex + 1) % cleanSlides.length;
        const nextUrl = cleanSlides[nextIndex];

        // 1. Stage the incoming slide behind wipe line
        incomingSlide.style.transition = 'none';
        wipeLine.style.transition = 'none';
        incomingSlide.style.backgroundImage = `url('${nextUrl}')`;
        incomingSlide.style.clipPath = 'inset(0 100% 0 0)';
        wipeLine.style.left = '0%';
        wipeLine.style.opacity = '1';

        // Force browser layout repaint
        void incomingSlide.offsetHeight;

        // 2. Animate incoming slide reveal and white vertical sweep in lockstep
        const timing = 'cubic-bezier(0.4, 0.0, 0.2, 1)';
        incomingSlide.style.transition = `clip-path ${WIPE_DURATION}ms ${timing}`;
        wipeLine.style.transition = `left ${WIPE_DURATION}ms ${timing}, opacity 250ms ease`;

        incomingSlide.style.clipPath = 'inset(0 0% 0 0)';
        wipeLine.style.left = '100%';

        // 3. Complete wipe: transfer to base slide and reset incoming
        setTimeout(() => {
            wipeLine.style.opacity = '0';
            baseSlide.style.backgroundImage = `url('${nextUrl}')`;
            incomingSlide.style.transition = 'none';
            incomingSlide.style.clipPath = 'inset(0 100% 0 0)';
            currentIndex = nextIndex;
        }, WIPE_DURATION + 60);

    }, INTERVAL);
})();
</script>
